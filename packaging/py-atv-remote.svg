<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a252f"/>
    </linearGradient>
    <linearGradient id="powerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="dpadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34495e"/>
      <stop offset="100%" stop-color="#243342"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Remote Body -->
  <rect x="36" y="8" width="56" height="112" rx="28" ry="28" fill="url(#bodyGrad)" filter="url(#shadow)"/>
  <rect x="38" y="10" width="52" height="108" rx="26" ry="26" fill="none" stroke="#4a627a" stroke-width="1.5" opacity="0.6"/>

  <!-- Power Button -->
  <circle cx="64" cy="24" r="7" fill="url(#powerGrad)"/>
  <!-- Power Icon Arc & Line -->
  <path d="M 61 21.5 A 4 4 0 1 0 67 21.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="64" y1="19.5" x2="64" y2="23.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- D-Pad Ring -->
  <circle cx="64" cy="56" r="21" fill="url(#dpadGrad)" stroke="#4a627a" stroke-width="1"/>
  <circle cx="64" cy="56" r="8" fill="#1e2b37"/>

  <!-- D-Pad Arrows -->
  <polygon points="64,39 60,43 68,43" fill="#bdc3c7"/>
  <polygon points="64,73 60,69 68,69" fill="#bdc3c7"/>
  <polygon points="47,56 51,52 51,60" fill="#bdc3c7"/>
  <polygon points="81,56 77,52 77,60" fill="#bdc3c7"/>

  <!-- System Buttons (Back / Home) -->
  <circle cx="51" cy="86" r="5" fill="#34495e"/>
  <path d="M 53 84 L 49 86 L 53 88" fill="none" stroke="#ecf0f1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="77" cy="86" r="5" fill="#34495e"/>
  <polygon points="77,83 74,86 75,86 75,89 79,89 79,86 80,86" fill="#ecf0f1"/>

  <!-- Volume Rocker Bar -->
  <rect x="58" y="98" width="12" height="16" rx="6" ry="6" fill="#1e2b37" stroke="#4a627a" stroke-width="1"/>
  <!-- Plus and Minus icons -->
  <line x1="64" y1="101" x2="64" y2="105" stroke="#bdc3c7" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="62" y1="103" x2="66" y2="103" stroke="#bdc3c7" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="62" y1="110" x2="66" y2="110" stroke="#bdc3c7" stroke-width="1.2" stroke-linecap="round"/>
</svg>
